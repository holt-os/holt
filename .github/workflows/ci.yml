name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the skill version check diffs against the base branch

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test the CLI
        run: node dist/cli.js version

      - name: Security guards
        run: node scripts/security-guards.mjs

      - name: Lint skills
        run: node scripts/lint-skills.mjs

      - name: Skill version bump check
        if: github.event_name == 'pull_request'
        run: node scripts/check-skill-versions.mjs "origin/${{ github.base_ref }}"

      - name: Guard against em-dashes
        run: |
          # Match U+2014 by codepoint so this file stays em-dash-free.
          if grep -rnP '\x{2014}' src README.md ARCHITECTURE.md CONTRIBUTING.md CONFIGURATION.md; then
            echo "em-dash found"
            exit 1
          fi
          echo "no em-dashes found"
